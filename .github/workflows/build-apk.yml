name: Build GoLike Helper APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Download gradle-wrapper.jar
      run: |
        mkdir -p gradle/wrapper
        curl -sL "https://github.com/gradle/gradle/releases/download/v8.4.0/gradle-8.4-bin.zip" -o /tmp/gradle.zip
        unzip -j /tmp/gradle.zip "gradle-8.4/lib/gradle-launcher-8.4.jar" -d /tmp/ || true
        curl -sL "https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradle/wrapper/gradle-wrapper.jar" \
          -o gradle/wrapper/gradle-wrapper.jar 2>/dev/null || \
        curl -sL "https://services.gradle.org/distributions/gradle-8.4-wrapper.jar.sha256" -o /dev/null && \
        curl -sL "https://raw.githubusercontent.com/nicholasgasior/android-hello-world/master/gradle/wrapper/gradle-wrapper.jar" \
          -o gradle/wrapper/gradle-wrapper.jar
        echo "Jar size: $(du -sh gradle/wrapper/gradle-wrapper.jar)"
        chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: GoLikeHelper-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ github.run_number }}
        name: "GoLike Helper v${{ github.run_number }}"
        body: |
          ## GoLike Helper APK - Auto Captcha Solver

          ### Cach cai dat:
          1. Tai file app-debug.apk ben duoi
          2. Bat "Cai tu nguon khong xac dinh" trong Cai dat
          3. Cai APK

          ### Quyen can cap sau khi cai:
          - Overlay (Hien thi tren ung dung khac)
          - Accessibility Service
          - Screen Capture (popup tu dong khi nhan Start)
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

